# RetroArch Configuration for Headless Streaming
# Optimized for WebRTC streaming with low latency

# Video Driver - OpenGL for headless rendering with Xvfb
video_driver = "gl"
video_windowed_fullscreen = "false"
video_fullscreen = "false"
video_vsync = "false"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "2"

# Resolution - 720p for optimal streaming performance
video_fullscreen_x = "1280"
video_fullscreen_y = "720"

# Audio Driver - PulseAudio (via PipeWire compatibility)
audio_driver = "pulse"
audio_enable = "true"
audio_latency = "32"
audio_sync = "true"
audio_rate_control = "true"
audio_rate_control_delta = "0.005"

# Input Driver
input_driver = "udev"
input_autodetect_enable = "true"

# Paths
savefile_directory = "/tmp/retroarch/saves"
savestate_directory = "/tmp/retroarch/states"
system_directory = "/tmp/retroarch/system"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/retroarch/assets"
rgui_browser_directory = "/roms"
content_database_path = "/usr/share/retroarch/database/rdb"
cheat_database_path = "/usr/share/retroarch/cheats"
cursor_directory = "/usr/share/retroarch/assets/xmb/monochrome"
overlay_directory = "/usr/share/retroarch/overlays"
video_shader_dir = "/usr/share/retroarch/shaders"

# Save Configuration
savestate_auto_save = "true"
savestate_auto_load = "false"
config_save_on_exit = "false"
savestate_thumbnail_enable = "false"

# Network Commands for Remote Control
network_cmd_enable = "true"
network_cmd_port = "55355"
stdin_cmd_enable = "true"

# Performance Optimizations
video_threaded = "true"
video_shared_context = "false"
menu_throttle_framerate = "false"
fastforward_ratio = "0.0"
slowmotion_ratio = "1.0"
rewind_enable = "false"

# Disable Unnecessary Features
load_dummy_on_core_shutdown = "false"
core_updater_auto_extract_archive = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
core_updater_show_experimental_cores = "false"

# Logging
log_verbosity = "true"
frontend_log_level = "1"

# Threading
threaded_data_runloop_enable = "true"

# Frame Throttle
fps_show = "false"

# Menu - Disable for headless operation
menu_driver = "rgui"
rgui_show_start_screen = "false"

# Disable OSD notifications
video_font_enable = "false"
notification_show_autoconfig = "false"
notification_show_cheats_applied = "false"
notification_show_patch_applied = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_disk_control = "false"
notification_show_save_state = "false"
notification_show_fast_forward = "false"
notification_show_screenshot = "false"

# Auto-save interval (every 5 minutes)
autosave_interval = "300"

# Quit on close content
quit_on_close_content = "0"

# No pause when focus is lost
pause_nonactive = "false"

# Disable screenshot feature for performance
screenshot_directory = "/tmp/retroarch/screenshots"

# Disable automatic remapping
input_remap_binds_enable = "false"
input_autodetect_enable = "true"

# Playlist settings
playlist_entry_rename = "false"
playlist_entry_remove = "false"

# History settings
content_history_size = "0"

# Runtime log
runtime_log_aggregate = "false"

# Core options
game_specific_options = "false"
auto_overrides_enable = "false"
auto_remaps_enable = "false"

# Accessibility
ai_service_enable = "false"

# Achievements (RetroAchievements) - Disabled for performance
cheevos_enable = "false"

# Cloud Sync - Disabled
cloud_sync_enable = "false"

# MIDI - Disabled
midi_input = "Off"
midi_output = "Off"

# Camera - Disabled
camera_allow = "false"

# Location - Disabled
location_allow = "false"